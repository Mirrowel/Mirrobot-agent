name = "mirrobot-mention-worker"
main = "worker.js"
compatibility_date = "2026-01-01"

# Free plan: 5 cron triggers per account, 30s CPU per run at sub-hour
# intervals. Every minute is the platform floor (cron cannot go sub-minute;
# DO alarms would be an architecture change for ~no real gain since GitHub
# notifications themselves lag seconds and the agent session runs minutes).
# 1,440 polls/day is far inside every free limit — the worker exits cheap
# when nothing qualifies.
[triggers]
crons = ["* * * * *"]

[vars]
# The repository running mention-poller.yml (the platform home).
PLATFORM_REPO = "Mirrowel/Mirrobot-agent"

# Secrets — set once with:
#   npx wrangler secret put BOT_PAT
#   npx wrangler secret put DISPATCH_PAT
# (BOT_PAT: bot account classic PAT, public_repo + notifications.
#  DISPATCH_PAT: fine-grained PAT, contents:write, scoped to PLATFORM_REPO
#  only. Never use a classic `repo`-scope token here.)
