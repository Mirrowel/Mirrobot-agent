name = "mirrobot-mention-worker"
main = "worker.js"
compatibility_date = "2026-01-01"

# SCHEDULING: the DO alarm loop in worker.js is the PRIMARY mechanism (30s
# period). The */5 cron below is a DORMANT BACKUP — never fires while the
# account's cron-dispatch bug persists (live evidence 2026-09-04); if it
# ever starts, that means the platform healed (and the primary loop died —
# investigate). Duplicate fires are no-ops: mark-read-before-dispatch in
# the repo pipeline is the at-most-once guard.
[triggers]
crons = ["*/5 * * * *"]

# Free tier: SQLite-backed DOs + alarms. The Scheduler singleton owns the
# 60s poll loop; at-most-once semantics live in the repo pipeline.
[durable_objects]
bindings = [{ name = "SCHEDULER", class_name = "Scheduler" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"]

[vars]
# The repository running mention-poller.yml (the platform home).
PLATFORM_REPO = "Mirrowel/Mirrobot-agent"

# Secrets — set once with:
#   npx wrangler secret put BOT_PAT
#   npx wrangler secret put DISPATCH_PAT
# (BOT_PAT: bot account classic PAT, public_repo + notifications.
#  DISPATCH_PAT: fine-grained PAT, contents:write, scoped to PLATFORM_REPO
#  only. Never use a classic `repo`-scope token here.)
