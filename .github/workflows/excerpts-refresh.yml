# Excerpts Refresh — rebuilds and redeploys the landing page with a fresh auto-card pool
#
# EXECUTES FROM: default branch (schedule + dispatch only; no PR triggers).
#
# Runs the harvester (search + GraphQL with the run token, read-only against
# public repos) over the home repos, quality-gates the agent's posts, and
# deploys docs/ (plus the regenerated excerpts.json) to GitHub Pages as a
# workflow artifact. Nothing is committed to main: the pool is derived
# content, so it never needs a push (the repo's branch rules stay untouched).
# The page fetches the static JSON same-origin — visitors spend zero API
# budget on excerpt cards. Zero secrets: GITHUB_TOKEN only.
#
# EDITABLE KNOBS — adjust for your deployment:
env:
  # space-separated owner/name list of the repos your agent runs in (public only)
  EXCERPT_REPOS: Mirrowel/Mirrobot-agent Mirrowel/LLM-API-Key-Proxy
  # comma-separated bot identities to harvest (account AND app forms)
  EXCERPT_BOTS: Mirrobot-Agent,mirrobot-agent[bot]
  # pool cap — how much weekly variety the cards draw from
  EXCERPT_MAX: "120"
  # recency tier: posts newer than this many days fill the pool first;
  # older material only tops up while the recent tier is under EXCERPT_MIN
  EXCERPT_DAYS: "180"
  EXCERPT_MIN: "40"

name: Excerpts Refresh
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC (off the :00 roundup)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: excerpts-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout (default branch)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run the harvester
        run: bash .github/scripts/harvest-excerpts.sh
        env:
          EXCERPT_REPOS: ${{ env.EXCERPT_REPOS }}
          EXCERPT_BOTS: ${{ env.EXCERPT_BOTS }}
          EXCERPT_MAX: ${{ env.EXCERPT_MAX }}
          EXCERPT_DAYS: ${{ env.EXCERPT_DAYS }}
          EXCERPT_MIN: ${{ env.EXCERPT_MIN }}
          GH_TOKEN: ${{ github.token }}
          GH_PAGER: ""

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload page artifact (docs/ + fresh pool)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
